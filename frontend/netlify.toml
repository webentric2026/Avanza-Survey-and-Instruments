[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# SPA fallback — must stay LAST so /api/* still hits the function.
# Serves index.html for /about, /rental, /services, etc. on refresh/direct visits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200